<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: linear-gradient(180deg, #071e22 0%, #1a0a3e 40%, #2a0a4e 100%);
    color: #fff;
    font-family: 'Oswald', Impact, sans-serif;
    min-height: 100vh;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(40px, env(safe-area-inset-bottom));
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.02) 2px, rgba(255,255,255,0.02) 4px);
    pointer-events: none;
    z-index: 0;
  }
  .container { max-width: 720px; margin: 0 auto; position: relative; z-index: 1; }

  /* ─── Header ─── */
  header { text-align: center; margin-bottom: 20px; padding-top: 8px; }
  .live-badge {
    display: inline-block;
    background: linear-gradient(90deg, #ff9b9e, #f5d58b, #8ee2c1);
    padding: 2px 14px;
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 12px;
    letter-spacing: 0.3em;
    color: #071e22;
    font-weight: 700;
    margin-bottom: 8px;
    transform: skew(-8deg);
  }
  h1 {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-weight: 400;
    font-size: clamp(44px, 11vw, 72px);
    margin: 0;
    color: #fff;
    letter-spacing: 0.04em;
    line-height: 0.95;
    text-shadow: 0 0 20px rgba(255, 31, 109, 0.6), 0 0 40px rgba(0, 212, 255, 0.4), 4px 4px 0 #ff9b9e;
  }
  .tagline {
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    letter-spacing: 0.4em;
    color: #f5d58b;
    font-weight: 600;
    margin-top: 4px;
    animation: neonFlicker 3s ease-in-out infinite;
  }
  .countdown { font-size: 13px; color: #8ee2c1; margin-top: 8px; font-weight: 600; letter-spacing: 0.1em; }

  @keyframes neonFlicker {
    0%, 100% { text-shadow: 0 0 10px currentColor, 0 0 20px currentColor, 0 0 40px currentColor; }
    50% { text-shadow: 0 0 5px currentColor, 0 0 10px currentColor, 0 0 20px currentColor; }
  }

  /* ─── Panels ─── */
  .panel {
    background: rgba(10, 10, 30, 0.7);
    padding: 16px;
    margin-bottom: 20px;
    position: relative;
  }
  .panel-cyan { border: 2px solid #8ee2c1; box-shadow: 0 0 20px rgba(0, 212, 255, 0.2); }
  .panel-pink { border: 2px solid #ff9b9e; box-shadow: 0 0 20px rgba(255, 31, 109, 0.2); }
  .panel-yellow { border: 2px solid #f5d58b; box-shadow: 0 0 20px rgba(255, 235, 0, 0.2); }
  .panel-grey { border: 1.5px solid #3a3a5e; }
  .panel-title {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 18px;
    letter-spacing: 0.25em;
    margin-bottom: 14px;
    text-align: center;
  }

  /* ─── Scoreboard ─── */
  .scoreboard {
    background: linear-gradient(180deg, #1a1a3e 0%, #0a0a2e 100%);
    border: 3px solid;
    border-image: linear-gradient(135deg, #8ee2c1, #ff9b9e) 1;
    padding: 20px 16px;
    margin-bottom: 20px;
    box-shadow: 0 0 40px rgba(0, 212, 255, 0.2), inset 0 0 20px rgba(0,0,0,0.6);
  }
  .scoreboard-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; }
  .player-name {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 20px;
    letter-spacing: 0.15em;
    margin-bottom: 4px;
  }
  .player-score {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: clamp(56px, 16vw, 88px);
    color: #fff;
    line-height: 0.9;
  }
  .vs {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 32px;
    color: #f5d58b;
    padding: 0 8px;
    text-shadow: 0 0 10px #ff6600, 2px 2px 0 #ff9b9e;
    transform: rotate(-8deg);
  }
  .leading-badge {
    display: inline-block;
    margin-top: 6px;
    padding: 2px 10px;
    color: #071e22;
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 12px;
    letter-spacing: 0.15em;
    font-weight: 700;
    transform: skew(-8deg);
  }
  .lead-text {
    text-align: center;
    margin-top: 14px;
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    color: #fff;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* John = cyan, Eve = pink */
  .john-color { color: #8ee2c1; text-shadow: 0 0 10px rgba(0, 212, 255, 0.6); }
  .eve-color { color: #ff9b9e; text-shadow: 0 0 10px rgba(255, 31, 109, 0.6); }
  .john-bg { background: #8ee2c1; }
  .eve-bg { background: #ff9b9e; }
  .john-glow { text-shadow: 0 0 20px rgba(0, 212, 255, 0.6), 0 0 40px rgba(0, 212, 255, 0.6), 4px 4px 0 #8ee2c1; }
  .eve-glow { text-shadow: 0 0 20px rgba(255, 31, 109, 0.6), 0 0 40px rgba(255, 31, 109, 0.6), 4px 4px 0 #ff9b9e; }

  /* ─── Arena ─── */
  .arena {
    background: linear-gradient(180deg, #1a1a3e 0%, #2a1a5e 30%, #4a2a3e 70%, #6a3a2a 100%);
    border: 3px solid #f5d58b;
    height: 320px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(255, 235, 0, 0.3), inset 0 0 60px rgba(0,0,0,0.5);
  }
  .spotlight {
    position: absolute; top: 0; width: 60px; height: 60px;
    background: radial-gradient(circle, rgba(255, 255, 200, 0.4) 0%, transparent 70%);
    animation: spotlight 4s ease-in-out infinite;
  }
  .spotlight-l { left: 10%; }
  .spotlight-r { right: 10%; animation-delay: 2s; }
  @keyframes spotlight {
    0%, 100% { opacity: 0.4; transform: translateX(-30px); }
    50% { opacity: 0.7; transform: translateX(30px); }
  }
  .crowd {
    position: absolute; top: 8px; left: 0; right: 0; height: 30px;
    background: repeating-linear-gradient(90deg, transparent 0px, transparent 8px, rgba(0,0,0,0.5) 8px, rgba(0,0,0,0.5) 14px);
    opacity: 0.6;
  }
  .floor {
    position: absolute; bottom: 0; left: 0; right: 0; height: 60px;
    background: linear-gradient(180deg, #4a2a3e 0%, #2a1a2e 100%);
    border-top: 2px solid #f5d58b;
    background-image: repeating-linear-gradient(90deg, transparent 0px, transparent 30px, rgba(255, 235, 0, 0.1) 30px, rgba(255, 235, 0, 0.1) 31px);
  }
  .gladiator-slot {
    position: absolute; bottom: 0; width: 38%; max-width: 200px; height: 290px;
  }
  .gladiator-slot.left { left: 5%; }
  .gladiator-slot.right { right: 5%; }
  .gladiator-slot.shake { animation: shake 0.4s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-4px) rotate(-1deg); }
    40% { transform: translateX(4px) rotate(1deg); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(3px); }
  }

  /* Gladiator SVG body parts */
  .body-group { transform-origin: 110px 220px; transition: transform 0.15s ease-out; }
  .body-group.hit { transform: translate(10px, 5px) rotate(8deg); }
  .club-arm { transform-origin: 150px 130px; transform: rotate(25deg); transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .club-arm-eve { transform-origin: 147px 130px; transform: rotate(25deg); transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .club-arm.swing, .club-arm-eve.swing { transform: rotate(-105deg); transition: transform 0.25s cubic-bezier(0.5, 0, 0.7, 1); }

  /* Impact burst */
  .burst {
    position: absolute;
    transform: translate(-50%, -50%);
    pointer-events: none;
    animation: burst 0.5s ease-out forwards;
    z-index: 10;
    width: 200px; height: 200px;
  }
  @keyframes burst {
    0% { transform: translate(-50%, -50%) scale(0.2) rotate(0deg); opacity: 0; }
    25% { transform: translate(-50%, -50%) scale(1.2) rotate(15deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.6) rotate(30deg); opacity: 0; }
  }

  /* ─── Buttons ─── */
  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .btn {
    background: transparent;
    border: 2px solid #3a3a5e;
    color: #a0a0c0;
    padding: 12px 12px;
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 18px;
    letter-spacing: 0.2em;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  .btn-type {
    border-width: 1.5px;
    font-family: 'Oswald', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.05em;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    color: #a0a0c0;
  }
  .btn-type.active {
    background: rgba(255, 235, 0, 0.15);
    border-color: #f5d58b;
    color: #f5d58b;
  }
  .btn-john.active {
    background: linear-gradient(135deg, #8ee2c1, #0066ff);
    border-color: #8ee2c1;
    color: #071e22;
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.6);
  }
  .btn-john { color: #8ee2c1; }
  .btn-eve.active {
    background: linear-gradient(135deg, #ff9b9e, #ff66a3);
    border-color: #ff9b9e;
    color: #071e22;
    box-shadow: 0 0 20px rgba(255, 31, 109, 0.6);
  }
  .btn-eve { color: #ff9b9e; }

  .btn-engage {
    width: 100%;
    background: linear-gradient(135deg, #ff9b9e 0%, #ff3300 50%, #f5d58b 100%);
    border: none;
    color: #071e22;
    padding: 16px;
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 22px;
    letter-spacing: 0.3em;
    cursor: pointer;
    box-shadow: 0 0 30px rgba(255, 31, 109, 0.5), 0 4px 0 #660020;
    font-weight: 700;
  }
  .btn-engage:active { transform: translateY(2px); box-shadow: 0 0 20px rgba(255, 31, 109, 0.5), 0 2px 0 #660020; }
  .btn-engage:disabled { opacity: 0.5; cursor: wait; }

  /* ─── Breakdown ─── */
  .breakdown-grid {
    display: grid;
    grid-template-columns: auto 1fr 1fr;
    gap: 12px 16px;
    align-items: center;
    font-size: 14px;
  }
  .breakdown-header {
    text-align: center;
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 16px;
    letter-spacing: 0.15em;
  }
  .breakdown-label {
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase;
    font-size: 13px;
    letter-spacing: 0.05em;
  }
  .breakdown-value {
    text-align: center;
    color: #fff;
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 22px;
  }

  /* ─── Chart ─── */
  .chart-wrapper { height: 220px; position: relative; }

  /* ─── History ─── */
  .history-toggle {
    width: 100%;
    background: transparent;
    border: none;
    color: #8ee2c1;
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 16px;
    letter-spacing: 0.2em;
    cursor: pointer;
    padding: 4px;
  }
  .history-list { margin-top: 12px; max-height: 300px; overflow-y: auto; }
  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 4px;
    border-bottom: 1px solid #1a1a3e;
    font-size: 13px;
  }
  .history-left { display: flex; align-items: center; gap: 10px; }
  .history-name { font-family: 'Bebas Neue', Impact, sans-serif; font-size: 16px; min-width: 50px; letter-spacing: 0.1em; }
  .history-type { color: #fff; font-family: 'Oswald', sans-serif; text-transform: uppercase; font-size: 12px; letter-spacing: 0.05em; }
  .history-right { display: flex; align-items: center; gap: 8px; }
  .history-time { color: #7a7aaa; font-size: 11px; font-family: 'Oswald', sans-serif; }
  .delete-btn {
    background: transparent;
    border: none;
    color: #ff9b9e;
    cursor: pointer;
    font-size: 16px;
    padding: 0 4px;
  }

  /* ─── Toast ─── */
  .toast {
    position: fixed;
    top: max(20px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, #ff9b9e, #ff3300, #f5d58b);
    border: 2px solid #fff;
    color: #071e22;
    padding: 12px 24px;
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 16px;
    letter-spacing: 0.2em;
    box-shadow: 0 4px 20px rgba(255, 31, 109, 0.6);
    animation: slideIn 0.3s ease-out;
    z-index: 100;
    font-weight: 700;
    text-transform: uppercase;
  }
  @keyframes slideIn {
    from { transform: translate(-50%, -30px); opacity: 0; }
    to { transform: translate(-50%, 0); opacity: 1; }
  }

  /* ─── Status / errors ─── */
  .status {
    text-align: center;
    padding: 12px;
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    color: #f5d58b;
    border: 1px dashed #f5d58b;
    margin-bottom: 16px;
    letter-spacing: 0.05em;
  }
  .status.error { color: #ff9b9e; border-color: #ff9b9e; }
  .status.hidden { display: none; }

  .footer {
    text-align: center;
    margin-top: 32px;
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 14px;
    color: #5a5a7a;
    letter-spacing: 0.3em;
  }
  .sync-indicator {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #00ff88;
    margin-right: 6px;
    animation: pulse 2s ease-in-out infinite;
  }
  .sync-indicator.offline { background: #ff9b9e; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

/* Christmas edition */
body {background:radial-gradient(ellipse at top,#194344,#071e22 75%);color:#f7f5ea;}
body::before {background-image:radial-gradient(#ffffff12 1px,transparent 1px);background-size:24px 24px;}
header {margin-bottom:22px;}.live-badge {background:none;color:#b7cfc8;transform:none;font-size:14px;letter-spacing:.2em;}
h1 {text-shadow:0 3px 0 #a52e40;letter-spacing:.07em;}.tagline {color:#f5d58b;font-size:16px;animation:none;letter-spacing:.25em;margin-top:9px;}
.countdown {color:#d1e6df;font-size:14px;}.scoreboard {background:#103034;border:1px solid #52726b;border-radius:16px;box-shadow:none;margin-bottom:12px;padding:18px;}
.player-score {font-size:64px;}.player-name {font-size:20px;}.john-glow,.eve-glow,.john-color,.eve-color {text-shadow:none;}.vs {text-shadow:none;transform:none;font-size:26px;}
.panel {background:#103034;border:1px solid #52726b;border-radius:16px;box-shadow:none;}.panel-title {text-shadow:none!important;font-size:20px;letter-spacing:.14em;}
.arena {height:300px;border:1px solid #52726b;border-radius:16px;background:radial-gradient(circle at 50% 15%,#bce7df30 0,transparent 40%),linear-gradient(#123840,#345a60);box-shadow:none;}
.arena::before {content:'✦';position:absolute;left:49%;top:20px;font-size:30px;color:#f5d58b;}
.floor {height:55px;background:#e4f3f0;border:none;border-radius:50% 40% 0 0;bottom:-7px;}
.winter-trees {position:absolute;bottom:30px;left:-5%;width:110%;white-space:nowrap;color:#153e3f;font-size:135px;letter-spacing:10px;opacity:.8;}
.spotlight {display:none;}.gladiator-slot {height:270px;width:40%;}.club-arm,.club-arm-eve {transform-origin:141px 150px;transform:rotate(0deg);}.club-arm.swing {transform:rotate(-55deg);}.swing .held-snowball {opacity:0;}
.snowfall {position:absolute;inset:-100px 0 0;background-image:radial-gradient(white 1.5px,transparent 2px),radial-gradient(#ffffff99 2px,transparent 3px);background-size:43px 61px,79px 101px;animation:snowfall 8s linear infinite;pointer-events:none;}
@keyframes snowfall {to {transform:translateY(100px);}}
.snowball {position:absolute;width:23px;height:23px;border-radius:50%;background:#fff;box-shadow:inset -4px -4px 0 #c6e6eb,0 0 16px #ffffff80;z-index:8;pointer-events:none;}
.btn {border-radius:9px;color:#d1e0db;border-color:#47645f;}.btn-engage {background:#c33348;color:#fff8ee;border:1px solid #f17c86;box-shadow:0 4px 0 #812333;border-radius:10px;transform:none;font-size:24px;letter-spacing:.08em;}.btn-engage:hover {background:#df4054;}.btn-engage:disabled {opacity:.5;cursor:wait;}.footer {color:#b5ccc6;font-size:14px;letter-spacing:.08em;}
button:focus-visible {outline:3px solid #f5d58b;outline-offset:4px;}.lead-text {font-size:14px;}.toast {font-size:16px;}
@media(max-width:420px) {.arena {height:255px;}.gladiator-slot {height:230px;width:43%;}.gladiator-slot.left {left:2%;}.gladiator-slot.right {right:2%;}.tagline {font-size:14px;letter-spacing:.16em;}.countdown {font-size:12px;}.btn-engage {font-size:21px;}}
@media(prefers-reduced-motion:reduce) {*,*::before,*::after {animation:none!important;transition:none!important;}}

</style>

<div class="container">

  <header>
    <div class="live-badge">CHRISTMAS EDITION · JOHN & EVE</div>
    <h1>GLADIATORS</h1>
    <div class="tagline">SNOWBALL SHOWDOWN</div>
    <div class="countdown" id="countdown">FINISH LINE · 19 DECEMBER 2026</div>
    <div style="font-size: 11px; color: #7a7aaa; margin-top: 6px; font-family: Oswald;">
      <span class="sync-indicator" id="syncDot"></span><span id="syncText">connected</span>
    </div>
  </header>

  <div id="status" class="status hidden"></div>

  <!-- Scoreboard -->
  <div class="scoreboard">
    <div class="scoreboard-grid">
      <div style="text-align: center;">
        <div class="player-name john-color">JOHN</div>
        <div class="player-score" id="scoreJohn">0</div>
        <div id="leadingJohn"></div>
      </div>
      <div class="vs">VS</div>
      <div style="text-align: center;">
        <div class="player-name eve-color">EVE</div>
        <div class="player-score" id="scoreEve">0</div>
        <div id="leadingEve"></div>
      </div>
    </div>
    <div class="lead-text" id="leadText" aria-live="polite"></div>
  </div>

  <!-- Arena -->
  <div class="arena" id="arena">
    <div class="spotlight spotlight-l"></div>
    <div class="spotlight spotlight-r"></div>
    <div class="winter-trees" aria-hidden="true">♠ &nbsp; ♠ &nbsp; ♠ &nbsp; ♠ &nbsp; ♠</div><div class="snowfall" aria-hidden="true"></div>
    <div class="floor"></div>

    <!-- John (left) -->
    <div class="gladiator-slot left" id="slotJohn"><svg viewBox="0 0 220 320" role="img" aria-label="John in a Santa outfit" style="width:100%;height:100%;overflow:visible"><g ><g class="body-group" id="bodyJohn">
 <ellipse cx="111" cy="302" rx="58" ry="8" fill="#082b32" opacity=".17"/>
 <path d="M88 224 L87 285 M131 224 L133 285" stroke="#bb2f43" stroke-width="23" stroke-linecap="round"/>
 <path d="M77 275 L98 275 L99 300 L68 300 Q63 288 77 286Z M121 275 L143 275 L152 291 Q161 303 123 300Z" fill="#142d32"/>
 <path d="M76 273 L99 273 M121 273 L144 273" stroke="#fff6e8" stroke-width="9"/>

    </div>

    <!-- Eve (right) - mirrored -->
    <div class="gladiator-slot right" id="slotEve"><svg viewBox="0 0 220 320" role="img" aria-label="Eve in a Santa outfit" style="width:100%;height:100%;overflow:visible"><g transform="translate(220 0) scale(-1 1)"><g class="body-group" id="bodyEve">

    </div>

    <!-- Burst container -->
    <div id="burstContainer"></div>
  </div>

  <!-- Log -->
  <div class="panel panel-cyan">
    <div class="panel-title" style="color: #f5d58b; text-shadow: 0 0 10px #ff6600;">MAKE YOUR NEXT MOVE</div>
    <div class="btn-grid">
      <button class="btn btn-john active" data-player="john">JOHN</button>
      <button class="btn btn-eve" data-player="eve">EVE</button>
    </div>
    <div class="btn-grid" style="margin-bottom: 14px;">
      <button class="btn btn-type active" data-type="weights"><span style="font-size:18px;">🏋</span><span>Weights</span></button>
      <button class="btn btn-type" data-type="swimming"><span style="font-size:18px;">🏊</span><span>Swimming</span></button>
      <button class="btn btn-type" data-type="running"><span style="font-size:18px;">🏃</span><span>Running</span></button>
      <button class="btn btn-type" data-type="class"><span style="font-size:18px;">💪</span><span>Class</span></button>
      <button class="btn btn-type" data-type="no_booze_x3" style="grid-column: 1 / -1;"><span style="font-size:18px;">🚫🍺</span><span>No Booze x3</span></button>
    </div>
    <button class="btn-engage" id="engageBtn">❄ LOG WORKOUT & THROW</button>
  </div>

  <!-- Breakdown -->
  <div class="panel panel-pink" id="breakdownPanel" style="display:none;">
    <div class="panel-title eve-color">★ EVENT BREAKDOWN ★</div>
    <div class="breakdown-grid" id="breakdownGrid"></div>
  </div>

  <!-- Chart -->
  <div class="panel panel-yellow" id="chartPanel" style="display:none;">
    <div class="panel-title" style="color: #f5d58b;">★ THE LEADERBOARD ★</div>
    <div class="chart-wrapper"><canvas id="chartCanvas"></canvas></div>
  </div>

  <!-- History -->
  <div class="panel panel-grey" id="historyPanel" style="display:none;">
    <button class="history-toggle" id="historyToggle">▶ EVENT HISTORY (<span id="historyCount">0</span>)</button>
    <div class="history-list" id="historyList" style="display:none;"></div>
  </div>

  <div class="footer">ONE WORKOUT. ONE SNOWBALL. · FINISH LINE 19 DEC 2026</div>

</div>

<script>
  // ─── CONFIG CHECK ───────────────────────────────────────────────────────
  const statusEl = document.getElementById('status');
  if (SUPABASE_URL.includes('PASTE') || SUPABASE_KEY.includes('PASTE')) {
    statusEl.classList.remove('hidden');
    statusEl.classList.add('error');
    statusEl.textContent = '⚠ Setup incomplete — open the HTML file in a text editor and paste your Supabase URL and key at the top.';
  }

  // ─── SUPABASE ───────────────────────────────────────────────────────────
  const configured = !SUPABASE_URL.includes('PASTE') && !SUPABASE_KEY.includes('PASTE');
  const supa = configured && window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

  // ─── STATE ──────────────────────────────────────────────────────────────
  const PLAYERS = {
    john: { name: 'John', color: '#8ee2c1' },
    eve:  { name: 'Eve',  color: '#ff9b9e' },
  };
  const TYPES = {
    weights: { label: 'Weights', icon: '🏋' },
    swimming:{ label: 'Swimming', icon: '🏊' },
    running: { label: 'Running', icon: '🏃' },
    class:   { label: 'Class', icon: '💪' },
    no_booze_x3: { label: 'No Booze x3', icon: '🚫🍺' },
  };
  const END_DATE = new Date('2026-12-19T23:59:59');

  let workouts = [];
  let activePlayer = 'john';
  let activeType = 'weights';
  let chart = null;

  // ─── COUNTDOWN ──────────────────────────────────────────────────────────
  function updateCountdown() {
    const days = Math.max(0, Math.ceil((END_DATE - new Date()) / (1000 * 60 * 60 * 24)));
    document.getElementById('countdown').textContent =
      `${days} ${days === 1 ? 'DAY' : 'DAYS'} TO 19 DECEMBER · CHRISTMAS FINISH LINE`;
  }
  updateCountdown();
  setInterval(updateCountdown, 60000);

  // ─── SYNC INDICATOR ─────────────────────────────────────────────────────
  function setSync(connected, msg) {
    const dot = document.getElementById('syncDot');
    const txt = document.getElementById('syncText');
    if (connected) {
      dot.classList.remove('offline');
      txt.textContent = msg || 'connected';
    } else {
      dot.classList.add('offline');
      txt.textContent = msg || 'offline';
    }
  }

  // ─── LOAD ───────────────────────────────────────────────────────────────
  async function loadWorkouts() {
    try {
      const { data, error } = await supa
        .from('workouts')
        .select('*')
        .order('ts', { ascending: true });
      if (error) throw error;
      workouts = data || [];
      setSync(true);
      render();
    } catch (e) {
      console.error('Load failed', e);
      setSync(false, 'load failed');
      statusEl.classList.remove('hidden');
      statusEl.classList.add('error');
      statusEl.textContent = '⚠ Could not load — check Supabase config. ' + (e.message || '');
    }
  }

  // ─── REALTIME ───────────────────────────────────────────────────────────
  function subscribeRealtime() {
    supa.channel('workouts-channel')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'workouts' }, (payload) => {
        if (payload.eventType === 'INSERT') {
          if (!workouts.find(w => w.id === payload.new.id)) {
            workouts.push(payload.new);
            // If the insert came from the OTHER player (not us), play their animation
            const myLastEntry = workouts[workouts.length - 1];
            // Trigger animation for the player who just logged
            triggerAnim(payload.new.player);
            render();
          }
        } else if (payload.eventType === 'DELETE') {
          workouts = workouts.filter(w => w.id !== payload.old.id);
          render();
        }
      })
      .subscribe();
  }

  // ─── LOG ────────────────────────────────────────────────────────────────
  async function logWorkout() {
    const btn = document.getElementById('engageBtn');
    if (!supa || btn.disabled) return;
    btn.disabled = true;
    const entry = {
      player: activePlayer,
      type: activeType,
      ts: new Date().toISOString(),
    };
    try {
      const { data, error } = await supa.from('workouts').insert(entry).select().single();
      if (error) throw error;
      // Realtime will add it, but add immediately for snappy UX
      if (!workouts.find(w => w.id === data.id)) {
        workouts.push(data);
        triggerAnim(entry.player);
        render();
      }
      showToast(`${PLAYERS[entry.player].name} logged ${TYPES[entry.type].label} — snowball away!`);
    } catch (e) {
      console.error('Insert failed', e);
      showToast('Save failed — check connection');
    }
    btn.disabled = false;
  }

  async function deleteWorkout(id) {
    if (!confirm('Remove this entry?')) return;
    try {
      const { error } = await supa.from('workouts').delete().eq('id', id);
      if (error) throw error;
      workouts = workouts.filter(w => w.id !== id);
      render();
    } catch (e) {
      alert('Delete failed: ' + (e.message || e));
    }
  }

  // ─── ANIMATION ──────────────────────────────────────────────────────────
  const snowballQueue = [];
  let snowballBusy = false;
  function triggerAnim(player) {
    if (!PLAYERS[player]) return;
    snowballQueue.push(player);
    playNextSnowball();
  }
  function playNextSnowball() {
    if (snowballBusy || !snowballQueue.length) return;
    snowballBusy = true;
    const player = snowballQueue.shift();
    const target = player === 'john' ? 'Eve' : 'John';
    const arm = document.getElementById(player === 'john' ? 'clubArmJohn' : 'clubArmEve');
    const body = document.getElementById('body' + target);
    const slot = document.getElementById('slot' + target);
    const arena = document.getElementById('arena');
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const ball = document.createElement('div');
    ball.className = 'snowball'; ball.setAttribute('aria-hidden', 'true');
    const from = player === 'john' ? 34 : 66;
    const to = player === 'john' ? 73 : 27;
    ball.style.left = from + '%'; ball.style.top = '45%';
    arena.appendChild(ball);
    arm.classList.add('swing');
    if (!reduced) ball.animate([
      {left: from + '%', top: '45%', transform: 'scale(1)'},
      {left: '50%', top: '22%', transform: 'scale(.85)', offset: .5},
      {left: to + '%', top: '42%', transform: 'scale(1)'}
    ], {duration: 520, easing:'ease-in', fill:'forwards'});
    setTimeout(() => {
      ball.remove();
      if (!reduced) { body.classList.add('hit'); slot.classList.add('shake'); }
      const burst = document.createElement('div');
      burst.className = 'burst'; burst.style.left = to + '%'; burst.style.top = '42%';
      burst.innerHTML = '<svg width="200" height="200" viewBox="0 0 200 200" aria-hidden="true"><g fill="#fff"><circle cx="100" cy="100" r="36"/><circle cx="53" cy="78" r="9"/><circle cx="150" cy="70" r="7"/><circle cx="144" cy="134" r="11"/><circle cx="65" cy="144" r="6"/></g><text x="100" y="111" text-anchor="middle" font-size="30" font-family="Impact,sans-serif" fill="#17464c">SPLAT!</text></svg>';
      arena.appendChild(burst);
      setTimeout(() => {
        burst.remove(); arm.classList.remove('swing'); body.classList.remove('hit'); slot.classList.remove('shake');
        snowballBusy = false; playNextSnowball();
      }, 550);
    }, reduced ? 0 : 520);
  }

  // ─── TOAST ──────────────────────────────────────────────────────────────
  function showToast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2200);
  }

  // ─── RENDER ─────────────────────────────────────────────────────────────
  function render() {
    const stats = { john: { total: 0, weights: 0, swimming: 0, running: 0, class: 0, no_booze_x3: 0 },
                    eve:  { total: 0, weights: 0, swimming: 0, running: 0, class: 0, no_booze_x3: 0 } };
    workouts.forEach(w => {
      if (stats[w.player]) {
        stats[w.player].total++;
        if (stats[w.player][w.type] !== undefined) stats[w.player][w.type]++;
      }
    });

    // Scores
    document.getElementById('scoreJohn').textContent = stats.john.total;
    document.getElementById('scoreEve').textContent = stats.eve.total;
    const sJohn = document.getElementById('scoreJohn');
    const sEve = document.getElementById('scoreEve');
    sJohn.classList.remove('john-glow'); sEve.classList.remove('eve-glow');

    const leader = stats.john.total > stats.eve.total ? 'john'
                 : stats.eve.total > stats.john.total ? 'eve' : null;
    const diff = Math.abs(stats.john.total - stats.eve.total);

    document.getElementById('leadingJohn').innerHTML =
      leader === 'john' ? '<div class="leading-badge john-bg">★ LEADING ★</div>' : '';
    document.getElementById('leadingEve').innerHTML =
      leader === 'eve'  ? '<div class="leading-badge eve-bg">★ LEADING ★</div>' : '';
    if (leader === 'john') sJohn.classList.add('john-glow');
    if (leader === 'eve')  sEve.classList.add('eve-glow');

    document.getElementById('leadText').textContent =
      workouts.length === 0 ? '' :
      leader ? `${PLAYERS[leader].name} leads by ${diff}` : "It's neck and neck!";

    // Breakdown
    const bp = document.getElementById('breakdownPanel');
    if (workouts.length > 0) {
      bp.style.display = 'block';
      const grid = document.getElementById('breakdownGrid');
      grid.innerHTML = `
        <div></div>
        <div class="breakdown-header john-color">JOHN</div>
        <div class="breakdown-header eve-color">EVE</div>
      ` + Object.entries(TYPES).map(([id, t]) => `
        <div class="breakdown-label"><span style="font-size:18px;">${t.icon}</span><span>${t.label}</span></div>
        <div class="breakdown-value">${stats.john[id]}</div>
        <div class="breakdown-value">${stats.eve[id]}</div>
      `).join('');
    } else {
      bp.style.display = 'none';
    }

    // Chart
    const cp = document.getElementById('chartPanel');
    if (workouts.length > 0) {
      const sorted = [...workouts].sort((a, b) => new Date(a.ts) - new Date(b.ts));
      const start = new Date(sorted[0].ts); start.setHours(0,0,0,0);
      const today = new Date(); today.setHours(0,0,0,0);
      const labels = []; const jSeries = []; const eSeries = [];
      let jc = 0, ec = 0;
      const cur = new Date(start);
      while (cur <= today) {
        const dayStr = cur.toISOString().slice(0,10);
        sorted.filter(w => w.ts.slice(0,10) === dayStr).forEach(w => {
          if (w.player === 'john') jc++; else if (w.player === 'eve') ec++;
        });
        labels.push(`${cur.getDate()}/${cur.getMonth()+1}`);
        jSeries.push(jc); eSeries.push(ec);
        cur.setDate(cur.getDate() + 1);
      }
      if (labels.length > 1 && window.Chart) {
        cp.style.display = 'block';
        if (chart) chart.destroy();
        chart = new Chart(document.getElementById('chartCanvas'), {
          type: 'line',
          data: {
            labels,
            datasets: [
              { label: 'JOHN', data: jSeries, borderColor: '#8ee2c1', backgroundColor: '#8ee2c1', borderWidth: 3, tension: 0.2 },
              { label: 'EVE',  data: eSeries, borderColor: '#ff9b9e', backgroundColor: '#ff9b9e', borderWidth: 3, tension: 0.2 },
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { labels: { color: '#fff', font: { family: 'Bebas Neue', size: 14 } } },
              tooltip: { backgroundColor: '#071e22', borderColor: '#f5d58b', borderWidth: 2, titleColor: '#fff', bodyColor: '#fff' },
            },
            scales: {
              x: { ticks: { color: '#a0a0c0', font: { family: 'Oswald' } }, grid: { color: '#3a3a5e' } },
              y: { ticks: { color: '#a0a0c0', font: { family: 'Oswald' }, precision: 0 }, grid: { color: '#3a3a5e' }, beginAtZero: true },
            },
          }
        });
      } else {
        cp.style.display = 'none';
      }
    } else {
      cp.style.display = 'none';
    }

    // History
    const hp = document.getElementById('historyPanel');
    if (workouts.length > 0) {
      hp.style.display = 'block';
      document.getElementById('historyCount').textContent = workouts.length;
      const recent = [...workouts].sort((a, b) => new Date(b.ts) - new Date(a.ts)).slice(0, 50);
      document.getElementById('historyList').innerHTML = recent.map(w => {
        const t = TYPES[w.type] || { icon: '?', label: w.type };
        const d = new Date(w.ts);
        return `
          <div class="history-item">
            <div class="history-left">
              <span class="history-name ${w.player}-color">${PLAYERS[w.player].name.toUpperCase()}</span>
              <span class="history-type">${t.icon} ${t.label}</span>
            </div>
            <div class="history-right">
              <span class="history-time">${d.toLocaleDateString()} ${d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
              <button class="delete-btn" data-id="${w.id}">✕</button>
            </div>
          </div>
        `;
      }).join('');
    } else {
      hp.style.display = 'none';
    }
  }

  // ─── EVENT WIRING ───────────────────────────────────────────────────────
  document.querySelectorAll('[data-player]').forEach(b => {
    b.addEventListener('click', () => {
      activePlayer = b.dataset.player;
      document.querySelectorAll('[data-player]').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
    });
  });
  document.querySelectorAll('[data-type]').forEach(b => {
    b.addEventListener('click', () => {
      activeType = b.dataset.type;
      document.querySelectorAll('[data-type]').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
    });
  });
  document.getElementById('engageBtn').addEventListener('click', logWorkout);
  document.getElementById('historyToggle').addEventListener('click', () => {
    const list = document.getElementById('historyList');
    const btn = document.getElementById('historyToggle');
    const isHidden = list.style.display === 'none';
    list.style.display = isHidden ? 'block' : 'none';
    btn.innerHTML = (isHidden ? '▼' : '▶') + ` EVENT HISTORY (<span id="historyCount">${workouts.length}</span>)`;
  });
  document.addEventListener('click', (e) => {
    if (e.target.classList.contains('delete-btn')) {
      deleteWorkout(e.target.dataset.id);
    }
  });

  // ─── BOOT ───────────────────────────────────────────────────────────────
  render();
  if (supa) {
    loadWorkouts();
    subscribeRealtime();
  } else {
    setSync(false, configured ? "connection unavailable" : "setup needed");
    document.getElementById("engageBtn").disabled = true;
  }
</script>
